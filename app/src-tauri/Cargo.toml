[package]
name = "chinotto-app"
description = "Chinotto: music library manager and iPod sync"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "chinotto"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
chinotto-ipod = { path = "../../crates/chinotto-ipod" }
chinotto-gpod = { path = "../../crates/chinotto-gpod" }
lofty = "0.25"
unicode-normalization = "0.1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
