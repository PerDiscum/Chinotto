[package]
name = "chinotto-app"
description = "Chinotto: music library manager and music player sync"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "chinotto"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
cc = "1"

[dependencies]
chinotto-ipod = { path = "../../crates/chinotto-ipod" }
chinotto-gpod = { path = "../../crates/chinotto-gpod" }
chinotto-player = { path = "../../crates/chinotto-player" }
chinotto-mtp = { path = "../../crates/chinotto-mtp" }
chinotto-omg = { path = "../../crates/chinotto-omg" }
lofty = "0.25"
unicode-normalization = "0.1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
sys-locale = "0.3.2"
zip = { version = "9.0.5", default-features = false }
tauri-plugin-single-instance = "2"
mp3lame-encoder = "0.2.5"
flacenc = "0.4"
# Podcasts: fetching feeds and episodes (rustls, no OpenSSL), and reading them.
ureq = "3"
quick-xml = "0.42"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
