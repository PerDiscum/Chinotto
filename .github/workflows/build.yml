# Builds installable apps.
#  - Run it by hand: Actions → Build apps → Run workflow. Downloads appear under the run's "Artifacts".
#  - Push a tag like v0.1.0 and the apps are also attached to a draft GitHub release.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            out: target/universal-apple-darwin/release/bundle
          - name: Linux
            # Oldest supported runner = widest range of distributions the AppImage/deb run on.
            os: ubuntu-22.04
            args: --bundles deb,appimage,rpm
            out: target/release/bundle
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev rpm

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          # Both Mac architectures, combined into one universal app.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: Chinotto-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/rpm/*.rpm
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/rpm/*.rpm
