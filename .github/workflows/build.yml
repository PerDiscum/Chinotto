# Builds installable apps.
#  - Run it by hand: Actions → Build apps → Run workflow. Downloads appear under the run's "Artifacts".
#  - Push a tag like v0.1.0 and the apps are also attached to a draft GitHub release.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # Oldest macOS Chinotto supports; glib and libgpod are built for it too.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            out: target/universal-apple-darwin/release/bundle
          - name: Linux
            # Oldest supported runner = widest range of distributions the AppImage/deb run on.
            os: ubuntu-22.04
            args: --bundles deb,appimage,rpm
            out: target/release/bundle
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev libxml2-dev zlib1g-dev libasound2-dev rpm

      # libgpod needs glib. On macOS we build a static one (both architectures) and cache it.
      - name: Cache static glib (macOS)
        if: runner.os == 'macOS'
        id: glib-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: glib-macos-${{ hashFiles('scripts/build-glib-macos.sh') }}
      - name: Build static glib (macOS)
        if: runner.os == 'macOS' && steps.glib-cache.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja
          scripts/build-glib-macos.sh deps
      - name: Use static glib (macOS)
        if: runner.os == 'macOS'
        run: echo "CHINOTTO_DEPS=$GITHUB_WORKSPACE/deps" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          # Both Mac architectures, combined into one universal app.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Sign with the same certificate every time, when one is set up (see
      # docs/SIGNING.md), so macOS remembers the permissions you give Chinotto.
      # Without it the app is signed ad hoc, and macOS may keep asking.
      # A self-made certificate isn't trusted by default, so it's imported into
      # a keychain of its own and trusted for code signing on the build machine.
      - name: Signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No signing certificate set up; signing ad hoc."
            exit 0
          fi
          KC="$RUNNER_TEMP/chinotto.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$IDENTITY" -p "$KC" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Identities available for signing:"
          security find-identity -v -p codesigning "$KC"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing with: $IDENTITY"

      - name: Build
        working-directory: app
        run: |
          npm ci
          # The list of third-party software and licenses that ships inside the app.
          python3 ../scripts/licenses.py
          npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: Chinotto-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/rpm/*.rpm
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/rpm/*.rpm
            app/src-tauri/licenses/THIRD-PARTY-LICENSES.txt
            deps/.build/glib-*.tar.xz
            deps/.build/glib-*/subprojects/packagecache/*
