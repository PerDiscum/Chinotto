# Checks every push and pull request on Linux and macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Oldest macOS Chinotto supports; glib and libgpod are built for it too.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev libxml2-dev zlib1g-dev

      # libgpod needs glib. On macOS we build a static one (both architectures) and cache it.
      - name: Cache static glib (macOS)
        if: runner.os == 'macOS'
        id: glib-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: glib-macos-${{ hashFiles('scripts/build-glib-macos.sh') }}
      - name: Build static glib (macOS)
        if: runner.os == 'macOS' && steps.glib-cache.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja
          scripts/build-glib-macos.sh deps
      - name: Use static glib (macOS)
        if: runner.os == 'macOS'
        run: echo "CHINOTTO_DEPS=$GITHUB_WORKSPACE/deps" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Front end
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Tests that need a real iPod database skip themselves here (no CHINOTTO_TEST_IPOD).
      - name: Tests
        run: cargo test --workspace
